# OPTIONAL development override: exposes Postgres only on the host loopback
# (e.g. for psql/DBeaver or running Alembic from the host). Do not use in production.
#   docker compose -f docker-compose.yml -f docker-compose.dev-db.yml up -d
# `internal` networks do not allow published ports, so Postgres also joins
# a dedicated bridge network, used only for this purpose.
services:
  postgres:
    ports:
      - "127.0.0.1:${DB_PORT:?define DB_PORT en .env}:5432"
    networks: [backend_net, db_host_net]

networks:
  db_host_net:
    driver: bridge
