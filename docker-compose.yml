version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autoops-db
    restart: always
    environment:
      POSTGRES_USER: autoops_user
      POSTGRES_PASSWORD: autoops_password
      POSTGRES_DB: autoops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
